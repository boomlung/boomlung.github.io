<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poker With Friends</title>
  <link rel="stylesheet" href="./player_stack_manager.css" />
</head>
<body>
  <h1>Poker With Friends</h1>
  <button id="themeToggleButton" class="theme-toggle" type="button" aria-label="Switch to light theme">☀ Light mode</button>

  <section>
    <div class="toolbar">
      <h2>Players</h2>
      <div class="menu-container">
        <button id="deleteModeButton" type="button" class="delete-mode-button" aria-label="Enter delete mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
        </button>
        <button id="tableMenuButton" type="button" class="kebab-button" aria-label="Table options">
          <span class="kebab-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div id="tableMenu" class="table-menu hidden">
          <button id="undoButton" type="button" class="menu-item" disabled>Undo</button>
          <button id="redoButton" type="button" class="menu-item" disabled>Redo</button>
          <button id="toggleChipsButton" type="button" class="menu-item">
            Show total chips
            <span class="menu-check"></span>
          </button>
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>name</th>
          <th>stack</th>
          <th id="totalChipsHeader" class="hidden">total chips</th>
          <th id="deleteBtnHeader"></th>
        </tr>
      </thead>
      <tbody id="playersTableBody"></tbody>
    </table>
    <div class="toolbar">
      <h2>History</h2>
      <div class="menu-container">
        <button id="messageMenuButton" type="button" class="kebab-button" aria-label="Message options">
          <span class="kebab-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div id="messageMenu" class="table-menu hidden">
          <button id="clearMessageButton" type="button" class="menu-item">Clear</button>
        </div>
      </div>
    </div>
    <div id="message" class="message" aria-live="polite"></div>
    <div class="button-container">
      <button id="toggleMessageButton" type="button">Show All</button>
      <button id="resetButton" type="button">Reset</button>
    </div>
  </section>

  <!-- <section>
    <h2>Add / Removal of Player</h2>
    <div class="form-row">
      <label for="playerAction">Mode:</label>
      <select id="playerAction">
        <option value="add">add</option>
        <option value="removal">removal</option>
      </select>

      <input id="playerNameInput" type="text" placeholder="Legacy" disabled/>
      <select id="removePlayerSelect" class="hidden"></select>
      <button id="playerActionButton" type="button" class="blue-btn">Go</button>
    </div>
  </section> -->

  <section>
    <h2>Borrowing</h2>
    <div class="form-row">
      <label for="borrowerSelect">Borrower:</label>
      <select id="borrowerSelect"></select>

      <label for="lenderSelect">Lender:</label>
      <select id="lenderSelect"></select>

      <button id="borrowButton" type="button" class="blue-btn">Borrow</button>
    </div>
  </section>

  <!-- Add-player modal: a shared dimmed overlay sits behind each modal;
       toggling .hidden on both shows/hides the pair together. -->
  <div id="dimmedOverlay" class="modal-overlay hidden"> </div>
  <div id="addPlayerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addPlayerModalTitle">
    <h2 id="addPlayerModalTitle">Add Player</h2>
    <input id="modalPlayerNameInput" type="text" placeholder="Player name" />
    <p id="modalPlayerError" class="modal-error hidden"></p>
    <div class="button-container">
      <button id="modalAddButton" type="button" class="blue-btn">Add</button>
    </div>
  </div>

  <!-- 1. Load localForage library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <!-- 2. Main script -->
  <script src="./player_stack_manager.js"></script>
</body>
</html>
