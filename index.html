<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Stack Manager</title>
  <link rel="stylesheet" href="./player_stack_manager.css" />
</head>
<body>
  <h1>Player Stack Manager</h1>
  <button id="themeToggleButton" class="theme-toggle" type="button" aria-label="Switch to light theme">☀ Light mode</button>

  <section>
    <div class="toolbar">
      <h2>Players</h2>
      <button id="toggleChipsButton" type="button">Show total_chips</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>name</th>
          <th>stack</th>
          <th id="totalChipsHeader" class="hidden">total_chips</th>
        </tr>
      </thead>
      <tbody id="playersTableBody"></tbody>
    </table>
    
    <div id="message" class="message" aria-live="polite"></div>
    <button id="toggleMessageButton" type="button">Expand</button>
  </section>
  <section>
    <div class="history-controls">
      <button id="undoButton" type="button" disabled>Undo</button>
      <button id="redoButton" type="button" disabled>Redo</button>
    </div>
  </section>
  <section>
    <h2>Add / Removal of Player</h2>
    <div class="form-row">
      <label for="playerAction">Mode:</label>
      <select id="playerAction">
        <option value="add">add</option>
        <option value="removal">removal</option>
      </select>

      <input id="playerNameInput" type="text" placeholder="Player name" />
      <select id="removePlayerSelect" class="hidden"></select>
      <button id="playerActionButton" type="button">Go</button>
    </div>
  </section>

  <section>
    <h2>Borrowing</h2>
    <div class="form-row">
      <label for="borrowerSelect">borrower:</label>
      <select id="borrowerSelect"></select>

      <label for="lenderSelect">lender:</label>
      <select id="lenderSelect"></select>

      <button id="borrowButton" type="button">Borrow</button>
    </div>
  </section>

  <script src="./player_stack_manager.js"></script>
</body>
</html>
